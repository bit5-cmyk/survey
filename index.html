<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 이용인 간담회 만족도 및 2027년 욕구조사</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Firebase SDK (실시간 누적 DB) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            touch-action: manipulation;
        }
        .font-aac {
            font-family: 'Gowun Dodum', sans-serif;
        }
        .btn-option {
            transition: all 0.15s ease;
        }
        .btn-option:active {
            transform: scale(0.96);
        }
        .selected-good {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            box-shadow: 0 4px 6px -1px rgba(34, 197, 94, 0.2);
        }
        .selected-so-so {
            background-color: #fef9c3 !important;
            border-color: #eab308 !important;
            box-shadow: 0 4px 6px -1px rgba(234, 179, 8, 0.2);
        }
        .selected-bad {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);
        }
        .selected-act {
            background-color: #e0e7ff !important;
            border-color: #6366f1 !important;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

    <!-- 헤더 -->
    <header class="bg-indigo-600 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold flex items-center gap-2">
                🏠 <span>빛과둥지 장애인보호작업장</span>
            </h1>
            <div class="flex gap-2">
                <button onclick="switchTab('survey')" id="tab-survey-btn" class="px-3 py-1.5 bg-white text-indigo-700 font-bold rounded-lg shadow text-sm">
                    📝 설문참여
                </button>
                <button onclick="switchTab('stats')" id="tab-stats-btn" class="px-3 py-1.5 bg-indigo-700 text-white font-bold rounded-lg shadow text-sm">
                    📊 통계보기
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-6">

        <!-- 1. 설문 작성 영역 -->
        <section id="section-survey">
            <div class="bg-white rounded-2xl p-6 shadow-sm mb-6 border border-slate-200">
                <h2 class="text-xl md:text-2xl font-black text-slate-800 font-aac text-center mb-2">
                    2026년 이용인 간담회 만족도 및 2027년 욕구조사
                </h2>
                <p class="text-center text-slate-500 text-sm">그림(AAC)을 보며 솔직한 마음을 선택해 주세요!</p>
                <hr class="my-4">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">성명 (이름)</label>
                        <input type="text" id="user-name" placeholder="이름을 입력해주세요" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">작성일</label>
                        <input type="date" id="survey-date" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <form id="survey-form" class="space-y-6">
                <!-- 문항 1 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="font-bold text-slate-800 text-base md:text-lg mb-3">1. 오늘 간담회는 어떠셨나요?</p>
                    <div class="grid grid-cols-3 gap-3">
                        <button type="button" onclick="selectScore(1, 'good', this)" class="btn-option p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 flex flex-col items-center justify-center gap-2">
                            <span class="text-4xl">😊</span>
                            <span class="font-bold text-slate-700 text-sm">좋아요</span>
                        </button>
                        <button type="button" onclick="selectScore(1, 'so-so', this)" class="btn-option p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 flex flex-col items-center justify-center gap-2">
                            <span class="text-4xl">😐</span>
                            <span class="font-bold text-slate-700 text-sm">보통이에요</span>
                        </button>
                        <button type="button" onclick="selectScore(1, 'bad', this)" class="btn-option p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 flex flex-col items-center justify-center gap-2">
                            <span class="text-4xl">🙁</span>
                            <span class="font-bold text-slate-700 text-sm">아쉬워요</span>
                        </button>
                    </div>
                </div>

                <!-- 문항 2 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="font-bold text-slate-800 text-base md:text-lg mb-3">2. 간담회 장소와 준비된 음식은 마음에 드셨나요?</p>
                    <div class="grid grid-cols-3 gap-3">
                        <button type="button" onclick="selectScore(2, 'good', this)" class="btn-option p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 flex flex-col items-center justify-center gap-2">
                            <span class="text-4xl">😊</span>
                            <span class="font-bold text-slate-700 text-sm">좋아요</span>
                        </button>
                        <button type="button" onclick="selectScore(2, 'so-so', this)" class="btn-option p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 flex flex-col items-center justify-center gap-2">
                            <span class="text-4xl">😐</span>
                            <span class="font-bold text-slate-700 text-sm">보통이에요</span>
                        </button>
                        <button type="button" onclick="selectScore(2, 'bad', this)" class="btn-option p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 flex flex-col items-center justify-center gap-2">
                            <span class="text-4xl">🙁</span>
                            <span class="font-bold text-slate-700 text-sm">아쉬워요</span>
                        </button>
                    </div>
                </div>

                    <p class="font
