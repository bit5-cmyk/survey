<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 이용인 간담회 만족도 및 2027년 욕구조사</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif; background-color: #fffbeb; touch-action: manipulation; position: relative; overflow-x: hidden; }
        .font-aac { font-family: 'Gowun Dodum', sans-serif; }
        .btn-option { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; user-select: none; }
        .btn-option:active { transform: scale(0.92); }
        
        /* 귀여운 파스텔 선택 효과 */
        .selected-good { background-color: #dcfce7 !important; border-color: #22c55e !important; box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.3); transform: translateY(-2px); }
        .selected-soso { background-color: #fef9c3 !important; border-color: #eab308 !important; box-shadow: 0 10px 15px -3px rgba(234, 179, 8, 0.3); transform: translateY(-2px); }
        .selected-bad { background-color: #fee2e2 !important; border-color: #ef4444 !important; box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3); transform: translateY(-2px); }
        .selected-check { background-color: #e0e7ff !important; border-color: #6366f1 !important; color: #4338ca !important; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3); transform: translateY(-2px); }

        /* 🍁 낙엽 애니메이션 효과 */
        .leaf-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .leaf {
            position: absolute;
            top: -50px;
            font-size: 26px;
            user-select: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.9; }
            50% { transform: translateY(50vh) rotate(180deg) translateX(30px); }
            100% { transform: translateY(105vh) rotate(360deg) translateX(-30px); opacity: 0.2; }
        }
    </style>
</head>
<body class="bg-amber-50/50 min-h-screen pb-12">

    <!-- 🍂 떨어지는 낙엽 -->
    <div class="leaf-container" id="leaf-container"></div>

    <!-- 헤더 -->
    <header class="bg-amber-400 text-slate-800 sticky top-0 z-50 shadow-sm border-b-2 border-amber-200">

            <h1 class="text-base md:text-lg font-black flex items-center gap-2 font-aac text-slate-800">
                🏡 <span>빛과둥지 장애인보호작업장</span>
            </h1>
            <div class="flex gap-2">
                <button onclick="switchTab('survey')" id="tab-survey-btn" class="px-3.5 py-1.5 bg-white text-amber-800 font-bold rounded-full shadow-sm text-sm border-2 border-amber-200">📝 설문하기</button>
                <button onclick="switchTab('stats')" id="tab-stats-btn" class="px-3.5 py-1.5 bg-amber-500 text-white font-bold rounded-full shadow-sm text-sm">📊 통계보기</button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-6 relative z-10">

        <!-- 1. 설문 작성 영역 -->
