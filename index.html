<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAC 자조모임 만족도 조사 및 통계 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            touch-action: manipulation;
        }
        .font-aac {
            font-family: 'Gowun Dodum', sans-serif;
        }
        .btn-option {
            transition: all 0.15s ease;
        }
        .btn-option:active {
            transform: scale(0.96);
        }
        .selected-good {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            box-shadow: 0 4px 6px -1px rgba(34, 197, 94, 0.2);
        }
        .selected-so-so {
            background-color: #fef9c3 !important;
            border-color: #eab308 !important;
            box-shadow: 0 4px 6px -1px rgba(234, 179, 8, 0.2);
        }
        .selected-bad {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);
        }
        .selected-act {
            background-color: #e0e7ff !important;
            border-color: #6366f1 !important;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

    <!-- 헤더 -->
    <header class="bg-indigo-600 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold flex items-center gap-2">
                🏠 <span>빛과둥지 장애인보호작업장</span>
            </h1>
            <div class="flex gap-2">
                <button onclick="switchTab('survey')" id="tab-survey-btn" class="px-3 py-1.5 bg-white text-indigo-700 font-bold rounded-lg shadow text-sm">
                    📝
